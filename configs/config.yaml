data:
  train_manifest: /mnt/mydisk/data/public_data/DC/KITTI-360/stage1_train_manifest.json
  val_manifest: /mnt/mydisk/data/public_data/DC/KITTI-360/stage1_val_manifest.json
  test_manifest: /mnt/mydisk/data/public_data/DC/KITTI-360/stage1_test_manifest.json
  
model:
  descriptor_dim: 128
  backbone_type: dinov3
  backbone_name: dinov3_vits16
  output_type: dense-cls
  shared_backbone: true
  per_view_adapter: true
  freeze_backbone: true
  dinov3_repo_path: /mnt/mydisk/toolNet/DINOv3/dinov3
  dinov3_weights_path: /mnt/mydisk/toolNet/DINOv3/dino_encoder/weights/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  conv_stride: 8

geometry:
  depth_type: camera_z
  lidar_query_radius_px: 4
  sanity_query_stride: 16

matcher:
  temperature: 0.07
  num_layers: 2
  num_heads: 4
  candidate_graph:
    enabled: true
    candidate_count: 4
    candidate_min_separation_px: 24.0
    hidden_dim: 96
    num_layers: 2
    dropout: 0.0
    include_diagonal_neighbors: true
    cross_region_links: true
    rotation_ransac_threshold_rad: 0.5
    rotation_ransac_hypotheses: 32
    use_geometry: true
    # The manifest depth must be camera-z, ray distance, or the matching
    # inverse representation. The graph never infers this from the filename.
    depth_source: mono
    depth_type: camera_z
    depth_units: arbitrary
    depth_valid_weight_threshold: 0.5
    min_depth_confidence: 0.0
    # KITTI vehicle frame x=forward, y=right, z=down; use [right, forward]
    # to keep the local plane handedness aligned by a proper rotation.
    vehicle_horizontal_axes: [1, 0]
    satellite_orientation_default: north_up
    # Set to ranking_only for ordinal-only maps; this suppresses metric
    # relation features because rank does not determine 3D layout.
    depth_relation: metric_or_global_scale
    # Fit one robust per-frame scale from current top-1 predictions. Use
    # "metric" only when the monocular depth scale has been calibrated.
    depth_scale_mode: robust
    max_logit_residual: 5.0

matching:
  score_mode: forward_softmax

refiner:
  # Same RoMa-style refiner definition as config_refine.yaml. It is not
  # executed when training.stage=coarse, but keeping the definition identical
  # makes checkpoint inspection and stage switching deterministic.
  radius: 2
  hidden_dim: null
  max_offset_px: 16.0
  scales: [16, 8, 4, 2, 1]
  fine_feature_dim: 64
  fine_pretrained: false
  hidden_blocks: 8
  depthwise: true
  displacement_emb_dims:
    16: 128
    8: 64
    4: 32
    2: 16
    1: 6
  local_corr_radii:
    16: 7
    8: 3
    4: 2
    2: null
    1: null

loss:
  lambda_coarse: 1.0
  lambda_refine: 1.0
  lambda_matchability: 0.1
  lambda_certainty: 0.1
  coarse_max_gt_grid_dist_px: 24.0
  lambda_graph_candidate: 0.25
  lambda_graph_structure: 0.05
  lambda_refine_structure: 0.05
  graph_structure_min_baseline_m: 1.0
  graph_structure_huber_beta_m: 1.0
  refine_structure_min_baseline_m: 1.0
  refine_structure_huber_beta_m: 1.0

training:
  stage: coarse
  output_dir: models/stage1/outputs/stage1_coarse
  batch_size: 64
  num_workers: 4
  epochs: 100
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  amp: true
  grad_clip_norm: 1.0
  log_interval: 10
  checkpoint_name: stage1_latest.pth
  best_loss_checkpoint_name: stage1_best_loss.pth
  best_metric_checkpoint_name: stage1_best_metric.pth

evaluation:
  batch_size: 1
  num_workers: 0

visualization:
  enabled: true
  frames_per_scene: 3
  max_points: 80
